[workspace]
resolver = "2"
members = [
    "src/pac/gd32f470",
    "src/firmware/blink-pac",
    "src/hal/embassy-gd32",
    "src/firmware/blink-hal",
    "src/firmware/blink-async",
        "src/firmware/uart-echo",
    "src/firmware/rs485-echo",
    "src/firmware/flash-identify",
    "src/firmware/flash-rw",
    "src/firmware/flash-self-prog",
    "src/firmware/can-loopback",
    "src/firmware/cpld-test",
    "src/firmware/dms-io-test",
    "src/firmware/ram-probe",
    "src/firmware/usart-async-test",
    "src/firmware/enet-phy-probe",
    "src/firmware/enet-link-test",
    "src/firmware/control-server",
    "src/firmware/enet-dma-test",
    "src/firmware/tcp-echo",
    "tools/mcp-server",
]
# stage0 裸寄存器版 blink 独立构建（自带 .cargo/config + memory.x），不并入 workspace
exclude = ["src/firmware/examples-stage0"]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
debug = true
