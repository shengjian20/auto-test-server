[package]
name = "control-server"
version = "0.3.0"
edition = "2021"

[lib]
test = false
bench = false

[[bin]]
name = "control-server"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "control-server-tcp"
path = "src/bin/control_server_tcp.rs"
test = false
bench = false

[features]
# MAC_LBM=1 自测模式（无网线全栈自环）；缺省=normal（接网线实测）
lbm = []

[dependencies]
embassy-gd32 = { path = "../../hal/embassy-gd32", features = ["embassy-net"] }
embassy-net-driver = "0.2"
embassy-net = { version = "0.7", default-features = false, features = ["medium-ethernet", "proto-ipv4", "tcp", "alloc"] }
gd32f470 = { path = "../../pac/gd32f470" }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5", features = ["generic-queue-64"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1.0"
linked_list_allocator = "0.10"
heapless = "0.8"
