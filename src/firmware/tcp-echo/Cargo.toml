[package]
name = "tcp-echo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tcp-echo"
test = false
bench = false

[dependencies]
embassy-gd32 = { path = "../../hal/embassy-gd32" }
gd32f470 = { path = "../../pac/gd32f470" }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5", features = ["generic-queue-64"] }
smoltcp = { version = "0.11", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "alloc",
] }
# 与 smoltcp 的 managed 依赖同版本统一（ManagedSlice::Owned 构造套接字缓冲）
managed = { version = "0.8", default-features = false, features = ["alloc"] }
linked_list_allocator = "0.10"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1.0"
