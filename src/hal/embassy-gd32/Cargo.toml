[package]
name = "embassy-gd32"
version = "0.1.0"
edition = "2021"
description = "Embassy-style async HAL for GD32F470 (skeleton: gpio + rcc sync APIs)"
license = "MIT OR Apache-2.0"

[dependencies]
gd32f470 = { path = "../../pac/gd32f470" }
embedded-hal = "1.0"
paste = "1"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["device"] }
critical-section = "1"
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
smoltcp = { version = "0.11", optional = true, default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp"] }

[features]
default = []
smoltcp-device = ["dep:smoltcp"]
