[package]
name = "gd32f470"
version = "0.1.0"
edition = "2021"
description = "svd2rust-generated PAC for GD32F470 (from GigaDevice DFP 3.5.0 SVD)"
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = "0.7"
vcell = "0.1"

[features]
default = []
rt = ["cortex-m-rt/device"]

[dependencies.cortex-m-rt]
optional = true
version = "0.7"

# 生成代码内部含必要的 unsafe（steal/寄存器指针），使用方 crate 用 deny(unsafe_code) 收口
